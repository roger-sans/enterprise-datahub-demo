[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-datahub-demo"
version = "1.0.0"
description = "A synthetic internal data enablement platform"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13.30,<1.14",
    "duckdb>=2.0,<2.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "sqlglot>=29,<31", "playwright>=1.51,<2"]
orchestration = ["dagster-webserver>=1.13.30,<1.14"]

[tool.setuptools]
packages = ["hub"]

[tool.setuptools.package-data]
hub = ["contracts/*.json", "sql/*.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
